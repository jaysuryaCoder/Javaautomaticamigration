<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Java 17 → 25 Migration Agent</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1b1f24; --muted: #667085; --line: #e4e7ec;
    --ok: #12805c; --ok-bg: #e3f6ee; --fail: #c0392b; --fail-bg: #fdecea;
    --run: #1d6fd8; --run-bg: #e6f0fd; --skip: #7a5b00; --skip-bg: #fff4d6; --pend: #667085; --pend-bg: #eef0f3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101317; --card: #181c22; --text: #e8eaee; --muted: #98a2b3; --line: #2a3038;
      --ok: #4cd9a0; --ok-bg: #12332a; --fail: #ff8a7a; --fail-bg: #3a1a17;
      --run: #7db4ff; --run-bg: #14263f; --skip: #f1c75b; --skip-bg: #3a2f10; --pend: #98a2b3; --pend-bg: #232831;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  button.primary { background: var(--run); border-color: var(--run); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; }
  .bar { height: 8px; background: var(--pend-bg); border-radius: 99px; overflow: hidden; display: flex; margin-bottom: 16px; }
  .bar i { display: block; height: 100%; transition: width .3s; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; }
  .SUCCEEDED { color: var(--ok); background: var(--ok-bg); }
  .FAILED { color: var(--fail); background: var(--fail-bg); }
  .RUNNING { color: var(--run); background: var(--run-bg); }
  .SKIPPED { color: var(--skip); background: var(--skip-bg); }
  .PENDING { color: var(--pend); background: var(--pend-bg); }
  .muted { color: var(--muted); }
  a { color: var(--run); }
  #log { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; max-height: 260px; overflow: auto; padding: 10px 12px; white-space: pre-wrap; }
  #log .svc { color: var(--run); }
  .err { color: var(--fail); padding: 10px 12px; }
  .reason { max-width: 420px; word-break: break-word; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Java 17 → 25 Migration Agent</h1>
      <div class="sub" id="mode">connecting…</div>
    </div>
    <div>
      <button id="cancel" disabled>Cancel run</button>
      <button id="start" class="primary">Start migration</button>
    </div>
  </header>

  <div class="stats" id="stats"></div>
  <div class="bar" id="bar"></div>
  <div class="err" id="error" hidden></div>

  <div class="panel">
    <table>
      <thead><tr><th>Service</th><th>Status</th><th>Step</th><th>Repairs</th><th>Result</th></tr></thead>
      <tbody id="rows"><tr><td colspan="5" class="muted">No run yet. Press “Start migration”.</td></tr></tbody>
    </table>
  </div>

  <div class="panel"><div id="log" aria-live="polite"></div></div>
</main>

<script>
const token = new URLSearchParams(location.search).get('token');
const headers = token ? { 'X-API-Token': token } : {};
const $ = id => document.getElementById(id);
let runId = null, es = null, startedAt = null, finishedAt = null, ticker = null;
const svcs = new Map();   // name -> { status, node, repairs, result }

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, { ...opts, headers: { ...headers, 'Content-Type': 'application/json' } });
  if (!res.ok) {
    let msg = res.status + ' ' + res.statusText;
    try { const j = await res.json(); if (j.message) msg = j.message; } catch (_) {}
    throw new Error(msg);
  }
  return (res.headers.get('content-type') || '').includes('json') ? res.json() : res.text();
}

function showError(msg) { const e = $('error'); e.hidden = !msg; e.textContent = msg || ''; }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function render() {
  const all = [...svcs.entries()];
  const count = st => all.filter(([, s]) => s.status === st).length;
  const total = all.length, ok = count('SUCCEEDED'), failed = count('FAILED'), skipped = count('SKIPPED'), running = count('RUNNING');
  const elapsed = startedAt ? Math.max(0, Math.round(((finishedAt || Date.now()) - startedAt) / 1000)) : 0;
  const mm = String(Math.floor(elapsed / 60)).padStart(2, '0'), ss = String(elapsed % 60).padStart(2, '0');

  $('stats').innerHTML = [['Total', total], ['Succeeded', ok], ['Running', running], ['Failed', failed], ['Skipped', skipped], ['Elapsed', mm + ':' + ss]]
    .map(([l, v]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');
  const pct = n => total ? (100 * n / total) + '%' : '0%';
  $('bar').innerHTML = `<i style="width:${pct(ok)};background:var(--ok)"></i><i style="width:${pct(failed)};background:var(--fail)"></i><i style="width:${pct(skipped)};background:var(--skip)"></i><i style="width:${pct(running)};background:var(--run)"></i>`;

  if (!total) return;
  $('rows').innerHTML = all.map(([name, s]) => {
    const result = s.pr ? `<a href="${esc(s.pr)}" target="_blank" rel="noopener">pull request</a>` : `<span class="reason muted">${esc(s.result)}</span>`;
    return `<tr><td><b>${esc(name)}</b></td><td><span class="pill ${s.status}">${s.status}</span></td>`
      + `<td class="muted">${esc(s.node || '')}</td><td>${s.repairs || ''}</td><td>${result}</td></tr>`;
  }).join('');
}

function log(e) {
  const box = $('log');
  const t = new Date(e.time).toLocaleTimeString();
  const line = document.createElement('div');
  const who = e.service ? `<span class="svc">${esc(e.service)}</span> ` : '';
  const what = e.type === 'NODE_STARTED' ? 'step: ' + e.node : e.type === 'NODE_FINISHED' ? '' : (e.message || e.type);
  if (!what) return;
  line.innerHTML = `${t}  ${who}${esc(what)}`;
  const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 8;
  box.appendChild(line);
  while (box.childElementCount > 400) box.removeChild(box.firstChild);
  if (atBottom) box.scrollTop = box.scrollHeight;
}

function apply(e) {
  const s = e.service ? svcs.get(e.service) : null;
  switch (e.type) {
    case 'RUN_STARTED': startedAt = new Date(e.time).getTime(); break;
    case 'SERVICE_STARTED': if (s) { s.status = 'RUNNING'; } break;
    case 'NODE_STARTED': if (s) { s.node = e.node; if (e.node === 'repair') s.repairs = (s.repairs || 0) + 1; } break;
    case 'SERVICE_SUCCEEDED': if (s) { s.status = 'SUCCEEDED'; s.node = ''; if ((e.message || '').startsWith('http')) s.pr = e.message; else s.result = e.message; } break;
    case 'SERVICE_FAILED': if (s) { s.status = 'FAILED'; s.node = ''; s.result = e.message; } break;
    case 'SERVICE_SKIPPED': if (s) { s.status = 'SKIPPED'; s.result = e.message; } break;
    case 'RUN_FINISHED':
      finishedAt = new Date(e.time).getTime();
      $('start').disabled = false; $('cancel').disabled = true;
      if (es) { es.close(); es = null; }
      break;
  }
  log(e);
  render();
}

async function attach(id) {
  runId = id; svcs.clear(); finishedAt = null; $('log').innerHTML = '';
  const run = await api('/migrations/' + id);
  run.services.forEach(s => svcs.set(s.name, { status: 'PENDING', node: '', repairs: 0, result: '' }));
  startedAt = new Date(run.startedAt).getTime();
  $('start').disabled = true; $('cancel').disabled = false;
  render();
  if (es) es.close();
  es = new EventSource('/api/migrations/' + id + '/events' + (token ? '?token=' + encodeURIComponent(token) : ''));
  es.addEventListener('run-event', m => apply(JSON.parse(m.data)));
  es.onerror = () => { /* the browser retries; RUN_FINISHED closes the stream for good */ };
  if (ticker) clearInterval(ticker);
  ticker = setInterval(() => { if (!finishedAt) render(); }, 1000);
}

$('start').onclick = async () => {
  showError('');
  try { const run = await api('/migrations', { method: 'POST' }); await attach(run.id); }
  catch (e) { showError(e.message); }
};
$('cancel').onclick = async () => {
  try { await api('/migrations/' + runId, { method: 'DELETE' }); } catch (e) { showError(e.message); }
};

(async function init() {
  try {
    const info = await api('/services');
    $('mode').textContent = `${info.mode} mode · ${info.count} services · ${info.waves.length} dependency wave(s)`;
    const runs = await api('/migrations');
    if (runs.length) await attach(runs[0].id);
    else render();
  } catch (e) { showError(e.message); $('mode').textContent = 'cannot reach the API'; }
})();
</script>
</body>
</html>
